name: chaterl

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Runs once, on first init of an empty volume: MongooseIM 6.2.1 schema (copied from the image's priv/pg.sql)
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    volumes:
      - mongo_data:/data/db
      # Runs once, on first init of an empty volume: collections + indexes
      - ./infra/mongo:/docker-entrypoint-initdb.d:ro
    ports:
      # localhost only, for MongoDB Compass / mongosh. 27018 avoids clashing with a locally installed MongoDB.
      - "127.0.0.1:${MONGO_HOST_PORT:-27018}:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  mongooseim:
    image: mongooseim/mongooseim:6.2.1
    hostname: mongooseim
    entrypoint: ["bash", "/templates/entrypoint.sh"]
    environment:
      XMPP_DOMAIN: ${XMPP_DOMAIN}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MONGOOSEIM_ADMIN_USER: ${MONGOOSEIM_ADMIN_USER}
      MONGOOSEIM_ADMIN_PASSWORD: ${MONGOOSEIM_ADMIN_PASSWORD}
      XMPP_ROOM_OWNER: ${XMPP_ROOM_OWNER:-nearby-rooms}
      JOIN_CLUSTER: "false"        # single node; skip the image's auto-clustering logic
    volumes:
      - ./infra/mongooseim/mongooseim.toml.tmpl:/templates/mongooseim.toml.tmpl:ro
      - ./infra/mongooseim/entrypoint.sh:/templates/entrypoint.sh:ro
      - mim_data:/var/lib/mongooseim
    ports:
      # localhost only by default. Set XMPP_BIND_ADDR=0.0.0.0 in .env to test from a phone on your LAN
      # (plaintext — dev only).
      - "${XMPP_BIND_ADDR:-127.0.0.1}:5280:5280"   # XMPP over WebSocket (/ws-xmpp)
      - "${XMPP_BIND_ADDR:-127.0.0.1}:5222:5222"   # XMPP c2s (desktop clients)
      # 5551 (admin GraphQL) is intentionally NOT published; geo_service reaches it on the Docker network.
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "mongooseimctl", "status"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  geo_service:
    build:
      context: ./geo_service
    image: chaterl/geo_service:dev
    environment:
      GEO_HTTP_IP: "0.0.0.0"          # inside the container; the host side is 127.0.0.1 below
      GEO_HTTP_PORT: ${GEO_HTTP_PORT:-8080}
      MONGO_HOSTS: ${MONGO_HOSTS:-mongo:27017}
      MONGO_DB: ${MONGO_DB:-chaterl}
      MONGO_REPLICA_SET: ${MONGO_REPLICA_SET:-}
      MONGO_USER: ${MONGO_USER:-}
      MONGO_PASSWORD: ${MONGO_PASSWORD:-}
      MONGO_AUTH_SOURCE: ${MONGO_AUTH_SOURCE:-}
      MONGO_TLS: ${MONGO_TLS:-false}
      MONGO_TLS_CA_FILE: ${MONGO_TLS_CA_FILE:-}
      MONGO_POOL_SIZE: ${MONGO_POOL_SIZE:-}
      JWT_SECRET: ${JWT_SECRET}
      XMPP_DOMAIN: ${XMPP_DOMAIN}
      MONGOOSEIM_ADMIN_URL: ${MONGOOSEIM_ADMIN_URL:-http://mongooseim:5551/api/graphql}
      MONGOOSEIM_ADMIN_USER: ${MONGOOSEIM_ADMIN_USER}
      MONGOOSEIM_ADMIN_PASSWORD: ${MONGOOSEIM_ADMIN_PASSWORD}
      XMPP_ROOM_OWNER: ${XMPP_ROOM_OWNER:-nearby-rooms}
    # No depends_on mongooseim on purpose: /api/ready does not depend on the admin API, and a
    # MongooseIM outage only makes POST /api/session answer 503. geo_service starts without it.
    depends_on:
      # Dev start ordering only: geo_service itself starts degraded and reconnects when Mongo is late.
      mongo:
        condition: service_healthy
    ports:
      # localhost only, like the other services (VITE_API_URL points here)
      - "127.0.0.1:${GEO_HTTP_PORT:-8080}:${GEO_HTTP_PORT:-8080}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${GEO_HTTP_PORT}/api/ready > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  pg_data:
  mongo_data:
  mim_data:
